site_name: Патерни проектування
theme:
  name: material
  font:
    text: Merriweather Sans
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky   # опційно: таби прилипають угорі

  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

extra_css:
  - css/extra.css


markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ООП:
    - Основи програмування:
      - Базові типи даних: 
        - Базові типи даних: oop/core/BasicTypes/dataType.md
        - int: oop/core/BasicTypes/int.md
        - double: oop/core/BasicTypes/double.md
        - decimal: oop/core/BasicTypes/decimal.md
        - string: oop/core/BasicTypes/string.md
        - char: oop/core/BasicTypes/char.md
        - bool: oop/core/BasicTypes/bool.md
      - Операції з базовими типами:
        - Числові операції:
          - Арифметичні оператори: oop/core/BasicTypeOperations/Numeric/arithmetic-operators.md
          - Порядок виконання операцій: oop/core/BasicTypeOperations/Numeric/operator-precedence.md
          - Складені оператори присвоєння: oop/core/BasicTypeOperations/Numeric/compound-assignment.md
          - Інкремент і декремент: oop/core/BasicTypeOperations/Numeric/increment-decrement.md
        - Оператори порівняння: oop/core/BasicTypeOperations/comparison-operators.md
        - Логічні операції: oop/core/BasicTypeOperations/logical-operations.md
        - Операції з рядками:
          - Конкатенація: oop/core/BasicTypeOperations/String/concatenation.md
          - Інтерполяція: oop/core/BasicTypeOperations/String/interpolation.md
          - Інші операції: oop/core/BasicTypeOperations/String/other-operations.md
      - Типи: 
        - Визначення: oop/core/type.md
        - Члени типів: oop/core/members.md

  - Патерни проєктування:
    - Глава 1. SOLID:
        - Open/Closed principle: patterns/chapter1/Open_Closed_Principle.md
    - Глава 2. Породжуючі патерни:
        - Будівельник (Builder): patterns/chapter2/Builder.md
  

